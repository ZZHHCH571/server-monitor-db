# 生产部署配置（本机 wrangler 直连 Cloudflare 使用）
name = "server-monitor"
main = "src/index.js"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

keep_vars = true

[vars]
# GitHub Pages 前台（https://zzhhch571.github.io/server-monitor-db）跨域访问本 Worker
CORS_ALLOWED_ORIGINS = "https://zzhhch571.github.io"

# 定时任务配置（UTC）
# - 每分钟：执行离线节点、资源告警
# - 每小时：合并执行其他定时任务（表轮换、旧表清理、按配置时区/小时触发服务器到期检测）
[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "server-monitor-db"
database_id = "66767f82-38b5-4ab7-8cd1-acb88d1cd4c6"

# Durable Objects：实时指标广播中心
[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

# Workers 原生限流（免费额度保护）：按 IP 分桶限制公开读取接口与后台入口
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# 开发服务器配置
[dev]
port = 8787
local_protocol = "https"
